name: Update verified portfolio
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-portfolio.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify latest portfolio
        shell: python
        run: |
          import hashlib, io, json, pathlib, zipfile
          root = pathlib.Path.cwd()
          payload = root / 'portfolio-update-15.zip'
          data = payload.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '8d1e7d90daca45b49b2b6b68bc68a11964e550cd1489509f3274edd9d1039115'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              archive.extractall(root)
          manifest = json.loads((root / 'FILE-MANIFEST.json').read_text())
          for name, digest in manifest.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          payload.unlink()
          print(f'Verified {len(manifest)} source and asset files')
      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Restore authored Home components and unify monochrome button motion'
          git push
