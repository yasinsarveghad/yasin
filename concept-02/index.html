<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yasin Sarveghad</title><style>html{background:#f8f8f9}@media(prefers-color-scheme:dark){html{background:#111114}}</style></head><body><script>
(async()=>{try{const route=location.hash.replace(/^#\/?/,'')||'home';const response=await fetch(route==='home'?'home.html':'portfolio-shell.html',{cache:'no-cache'});if(!response.ok)throw Error('Page unavailable');const html=await response.text();document.open();document.write(html);document.close()}catch(error){document.body.textContent='Unable to load the page. Please refresh.';console.error(error)}})();
</script></body></html>
